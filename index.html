      flex-wrap: wrap;

    .stat-card {
      background: rgba(30, 41, 59, 0.8);

      border-radius: 16px;
      text-align: center;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);

    .stat-number {
      font-size: 2em;
      font-weight: bold;
      color: #f59e0b;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      margin: 15px auto;
      padding: 25px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      max-width: 700px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .rank {
      font-size: 2.5em;
      font-weight: bold;
      min-width: 70px;
      text-align: center;
      margin-right: 20px;
    }
    .rank.gold { color: #facc15; }
    .rank.silver { color: #d1d5db; }
    .rank.bronze { color: #f97316; }
    img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-right: 25px;
      border: 4px solid;
      object-fit: cover;
    }
    .user-info h3 {
      margin: 0 0 10px 0;
      font-size: 1.4em;
      color: #f8fafc;
    }
    .user-info p {
      margin: 8px 0;
      opacity: 0.9;
      font-size: 0.95em;
    }
    .points {
      font-size: 1.3em;
      font-weight: bold;
      color: #10b981;
    }
    .loading, .error, .no-data {
      text-align: center;
      padding: 60px 20px;
      font-size: 1.2em;
    }
    .loading {
      color: #94a3b8;
    }
    .error {
      color: #ef4444;
    }
    .no-data {
      color: #64748b;
    }
    @media (max-width: 768px) {
      .card { flex-direction: column; text-align: center; }
      .rank { margin-right: 0; margin-bottom: 15px; }
      img { margin-right: 0; margin-bottom: 15px; }
      .stats { gap: 15px; }
    }
  </style>
</head>

// Replace this URL with your actual Google Apps Script or Jotform API endpoint
// const LIVE_API_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";
const LIVE_API_URL = "https://script.google.com/macros/s/AKfycbyNQZM11kIc2KFsubv7svoOOo_rWw1kG85BRDAHlVexOEEAYTFrDCRhY8vfgY-MDONKOA/exec"; // Set to null to use embedded data above

// Helper functions (same as before but optimized)
function getFullName(entry) {
  return `${entry["Full Name - First Name"] || ''} ${entry["Full Name - Last Name"] || ''}`.trim() || 'Anonymous Explorer';
}

function getPoints(entry) {
  return parseInt(entry.Points) || 0;
}

function getBadge(points) {
  if (points >= 100) return "🏆 VIP Explorer";
  if (points >= 50) return "🥇 Gold Explorer";
  if (points >= 20) return "🥈 Silver Explorer";
  if (points >= 15) return "🥉 Beginner";
  return "🌱 Newcomer";
}

function getReward(points) {
  if (points >= 100) return "VIP Experience";
  if (points >= 50) return "R500 Gift Card";
  if (points >= 20) return "Zartour Merch";
  return "Digital Badge";
}

function calculateStreak(submissions) {
  const dates = submissions.map(s => new Date(s["Submission Date"]));
  const uniqueDates = [...new Set(dates.map(d => d.toDateString()))];
  return uniqueDates.length;
}

// Process raw Jotform data into leaderboard format
function processData(rawData) {
  const userMap = {};
  
  rawData.forEach(entry => {
    const email = entry["Email Address"];
    const phone = entry["Phone Number (South African format)"];
    const key = email || phone;
    
    if (!key) return;
    
    const name = getFullName(entry);
    const photo = entry["Upload a Selfie to check in"];
    
    if (!userMap[key]) {
      userMap[key] = {
        key,
        Name: name,
        Email: email,
        Phone: phone,
        Photo: photo || 'https://via.placeholder.com/80?text=👤',
        Points: 0,
        Badge: "",
        Visits: [],
        Streak: 0,
        Reward: ""
      };
    }
    
    const points = getPoints(entry);
    userMap[key].Points += points;
    userMap[key].Visits.push({
      location: entry["Location Name (hidden)"] || 'Unknown',
      feedback: entry["Share a quick feedback about your experience today:"] || '',
      date: entry["Submission Date"],
      rating: parseInt(entry["Rate the Experience of Visited Location"]) || 0
    });
    
    if (photo) userMap[key].Photo = photo;
  });
  
  return Object.values(userMap).map(user => {
    user.Streak = calculateStreak(user.Visits);
    user.Badge = getBadge(user.Points);
    user.Reward = getReward(user.Points);
    return user;
  });
}

// Fetch live data and generate leaderboard
async function fetchAndRenderLeaderboard() {
  try {
    document.getElementById("leaderboard").innerHTML = '<div class="loading">🔄 Loading live Zartour data...</div>';
    
    let rawData;
    
    if (LIVE_API_URL) {
      // Live fetch from your API
      const response = await fetch(LIVE_API_URL);
      if (!response.ok) throw new Error(`API error: ${response.status}`);
      rawData = await response.json();
    } else {
      // Use embedded data (your actual Jotform submissions)
      rawData = ZARTOUR_DATA_SOURCE;
    }
    
    const processedData = processData(rawData);
    const sortedData = processedData.sort((a, b) => b.Points - a.Points);
    
    // Update stats
    const stats = document.getElementById("stats");
    stats.style.display = 'flex';
    document.getElementById("totalUsers").textContent = processedData.length;
    document.getElementById("totalPoints").textContent = processedData.reduce((sum, u) => sum + u.Points, 0);
    document.getElementById("totalVisits").textContent = rawData.length;
    
    if (sortedData.length === 0) {
      document.getElementById("leaderboard").innerHTML = '<div class="no-data">No check-ins yet. Be the first Zartour explorer! 🚀</div>';
      return;
    }
    
    // Generate top 10 leaderboard
    let html = "";
    sortedData.slice(0, 10).forEach((user, index) => {
      const rankClass = index === 0 ? 'gold' : index === 1 ? 'silver' : index === 2 ? 'bronze' : '';
      const rankEmoji = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `#${index + 1}`;
      
      html += `
        <div class="card">
          <div class="rank ${rankClass}">${rankEmoji}</div>
          <img src="${user.Photo}" onerror="this.src='https://via.placeholder.com/80?text=👤'" alt="${user.Name}" loading="lazy">
          <div class="user-info">
            <h3>${user.Name}</h3>
            <p class="points">⭐ ${user.Points} points</p>
            <p>🏅 ${user.Badge}</p>
            <p>📍 ${user.Visits.length} visits</p>
            <p>🔥 ${user.Streak}-day streak</p>
            <p>🎁 ${user.Reward}</p>
          </div>
        </div>
      `;
    });
    
    document.getElementById("leaderboard").innerHTML = html;
    
  } catch (error) {
    console.error("Leaderboard error:", error);
    document.getElementById("leaderboard").innerHTML = `
      <div class="error">
        ❌ Failed to load leaderboard<br>
        <small>Please check your API connection and refresh</small>
      </div>
    `;
  }
}

// Auto-refresh every 5 minutes
setInterval(fetchAndRenderLeaderboard, 5 * 60 * 1000);

// Load immediately
document.addEventListener('DOMContentLoaded', fetchAndRenderLeaderboard);
</script>
