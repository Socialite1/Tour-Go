<!DOCTYPE html>
<html>
<head>
  <title>Zartour Leaderboard</title>
  <style>
    body { font-family: Arial; background:#0f172a; color:white; }
    h1 { text-align:center; }
    .card {
      background:#1e293b;
      margin:10px;
      padding:10px;
      border-radius:10px;
      display:flex;
      align-items:center;
    }
    img {
      width:50px;
      height:50px;
      border-radius:50%;
      margin-right:10px;
    }
  </style>
</head>
<body>

<h1>🏆 Zartour Leaderboard</h1>
<div id="leaderboard"></div>

<script>
const sheetURL = "https://script.google.com/macros/s/AKfycbyNQZM11kIc2KFsubv7svoOOo_rWw1kG85BRDAHlVexOEEAYTFrDCRhY8vfgY-MDONKOA/exec";

function getReward(points) {
  if(points >= 100) return "VIP Experience";
  if(points >= 50) return "Gift Card";
  if(points >= 20) return "Merch";
  return "Digital Badge";
}

fetch(sheetURL)
  .then(res => res.json())
  .then(data => {
    data.sort((a,b) => b.Points - a.Points);
    let top10 = data.slice(0,10);

    let html = "";
    top10.forEach((user, index) => {
      html += `
        <div class="card">
          <div>#${index + 1}</div>
          <img src="${user.Photo}" />
          <div>
            <b>${user.Name}</b><br>
            ${user.Points} pts • ${user.Badge}<br>
            📍 ${user.Visits.length} visits<br>
            🔥 ${user.Streak}-day streak<br>
            🎁 Reward: ${user.Reward}
          </div>
        </div>
      `;
    });

    document.getElementById("leaderboard").innerHTML = html;
  });
</script>

</body>
</html>
