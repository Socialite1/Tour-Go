<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zartour Leaderboard</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  margin: 0;
}

header {
  text-align: center;
  padding: 20px;
  background: #020617;
  font-size: 24px;
  font-weight: bold;
}

.container {
  padding: 20px;
  max-width: 600px;
  margin: auto;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: #22c55e;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.card {
  background: #1e293b;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
  display: flex;
  align-items: center;
}

.rank {
  font-weight: bold;
  margin-right: 10px;
  color: gold;
}
</style>
</head>

<body>

<header>Zartour Leaderboard 🏆</header>

<div class="container">

<h3>Submit Your Experience</h3>

<input type="text" id="name" placeholder="Your Name">
<input type="email" id="email" placeholder="Your Email">
<input type="text" id="location" placeholder="Where you from">
<input type="text" id="place" placeholder="Place you visited">

<button onclick="submitForm()">Submit</button>

<h3>Top Explorers</h3>
<div id="board"></div>

</div>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];

function submitForm() {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const location = document.getElementById("location").value;
  const place = document.getElementById("place").value;

  if (!name || !email || !place) {
    alert("Fill all required fields");
    return;
  }

  processSubmission();

  function processSubmission() {

    // 🎯 POINT ENGINE
    let points = 10;

    const existingUser = users.find(u => u.email === email);
    const userPlaces = existingUser?.places || [];

    if (!userPlaces.includes(place)) {
      points += 30;
    } else {
      points += 5;
    }

    if (existingUser) {
      existingUser.points += points;
      existingUser.name = name;
      existingUser.location = location;

      if (!existingUser.places.includes(place)) {
        existingUser.places.push(place);
      }

      existingUser.badge = getBadge(existingUser.points);

    } else {
      users.push({
        name,
        email,
        location,
        points: points,
        badge: getBadge(points),
        places: [place]
      });
    }

    localStorage.setItem("users", JSON.stringify(users));
    renderLeaderboard();

    // ✅ Clear form (smooth UX)
    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("location").value = "";
    document.getElementById("place").value = "";

    alert("Submission successful 🚀");
  }
}

function getBadge(points) {
  if (points > 300) return "👑 King";
  if (points > 150) return "🔥 Legend";
  if (points > 80) return "⭐ Explorer";
  return "🌱 Starter";
}

function renderLeaderboard() {
  const board = document.getElementById("board");
  board.innerHTML = "";

  const sorted = users
    .sort((a, b) => b.points - a.points)
    .slice(0, 10);

  sorted.forEach((user, index) => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="rank">#${index + 1}</div>
      <div>
        <div><strong>${user.name}</strong></div>
        <div>${user.points} pts • ${user.badge}</div>
        <small>${user.places.length} places visited</small>
      </div>
    `;

    board.appendChild(div);
  });
}

renderLeaderboard();
</script>

</body>
</html>
